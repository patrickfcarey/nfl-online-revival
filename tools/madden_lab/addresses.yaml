  ai_state:
    source: fb-wr-blocking.md, zone-bunching.md, qb-read.md, block-cycle.md, pitch-play-runner.md
    confidence: doc
    note: >-
      Partial -- 24 of 115 rows are named anywhere in docs/. The remaining ~90
      are reachable only by hand-decoding the two state-indexed jump tables
      fb-wr-blocking.md points at (0x00583530, threat by state, 71 entries;
      0x00583650, defender list by +0xBCC, 77 entries). Neither has been
      enumerated.
      CORRECTION TO A WIDELY REPEATED CLAIM: 41 is NOT the press state. No
      document names 41 at all; it appears twice, both times only as a member
      of the coverage list the threat classifier at 0x001F2830 routes
      (22/37/38/39/40/41). press-and-routes.md discusses the press state at
      length and never gives its id. The press state id is UNKNOWN.
      A raw state byte taken from a chain record has bit 7 set as a
      "more follow" marker -- mask it off before comparing.
    values:
