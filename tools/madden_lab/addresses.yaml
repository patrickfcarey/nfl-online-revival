# The address map for Madden NFL 2004 (PS2, SLUS_207.52, CRC 0x14F8B841).
#
# Data, not code. `world.py` is the only thing that interprets it, so a wrong
# number is a one-line fix in one file and every consumer picks it up. Nothing
# here may be believed without a `source:` -- the whole point of writing it down
# is that a claim stays attached to the document it came from.
#
# Addresses are virtual, as loaded. For the 32 MB EE image
# (extract/ee_mainmenu.bin, and every savestate's eeMemory.bin) virtual address
# == file offset. For extract/SLUS_207.52, file_offset = vaddr - 0xFF000.
#
# `confidence:` is the only field that matters when something disagrees:
#
#   dump  -- read out of extract/ee_mainmenu.bin and the value matched what was
#            expected. The strongest grade available offline.
#   code  -- derived here by disassembling the instructions that use it, in the
#            same dump. Stronger than a document, weaker than seeing the value.
#   doc   -- taken on the cited document's word. Nothing confirmed it and
#            nothing contradicted it. Treat as a hypothesis.
#
# Main-menu caveat: every runtime pointer below except `ball_spot` is null in
# extract/ee_mainmenu.bin, because the game had not built a play yet. A null
# there is the expected reading, not a failure -- see `null_at_menu:`.

meta:
  game: Madden NFL 2004 (PS2)
  elf: extract/SLUS_207.52
  crc: 0x14F8B841
  gp: 0x006056F0
  elf_file_offset_bias: 0xFF000
  reference_dump: extract/ee_mainmenu.bin          # menu; every runtime pointer null
  reference_dump_inplay: extract/ee_inplay.bin     # pre-snap, 22 players on the field
  reference_state: extract/state_mainmenu.p2s
  verified_on: 2026-08-10

# ---------------------------------------------------------------------------
# Statics. Present and readable in any dump, including the main menu.
# ---------------------------------------------------------------------------
globals:

  option_values:
    addr: 0x0051FFD8
    type: u16
    count: 131
    source: slider-behavior.md
    confidence: dump
    note: >-
      131 confirmed empirically: the parallel name table stops being fourccs at
      index 131. Indices 16-55 all read 50 in the reference dump. Values are
      never clamped on write (SetOption is a bare sh), so out-of-range is
      possible and callers must not assume 0..100.

  option_names:
    addr: 0x0051FDC8
    type: fourcc
    count: 131
    source: slider-behavior.md
    confidence: dump
    note: >-
      Stored as readable ASCII, not byte-swapped. Index 0 is OQLN; 7 and 8 are
      both OFMO, which is a real duplicate in the shipped table and not a
      reader bug. Index 62 is EPPN.

  attribute_names:
    addr: 0x00520140
    type: fourcc
    count: 21
    source: cpu-dt-animations.md
    confidence: dump
    note: >-
      Exactly 21 entries, then zeros -- which is what fixes the length of the
      effective-ratings block at player+0xB70. Order read from the dump:
      PACC PAGI PAWR PBTK PCAR PCTH PJMP PIMP PINJ PKAC PKPR PPBK PRBK PSPD
      PSTA PSTR PTAK PTHA PTHP PTGH PKRT.

  ai_states:
    addr: 0x00527238
    stride: 24
    count: 115
    documented_count: 93
    type: fn_ptr
    columns: [enter, can_leave, ai_think, user_think, exit, extra]
    source: lessons-learned.md
    confidence: dump
    note: >-
      Six code pointers per row. The column order is lessons-learned.md's
      "enter / canLeave / AI-think / USER-think / exit" and it CHECKS OUT in
      the dump against five states documented elsewhere by address: 1
      (AIthink 0x001DFEB8), 31 (enter 0x001CABD8, think 0x001CB008), 32
      (AIthink 0x001E8088), 33 (enter 0x001DC110, think 0x001DC2D8) and 47
      (enter 0x001B66A8, think 0x001B6870). All five land in columns 0 and 2.
      Column 4 is 0x001B0528 in every live row, matching
      fact-check-2026-08.md's "shared no-op stub returning 0" for the exit
      predicate. Column 5 is unnamed and usually zero.
      COUNT RESOLVED 2026-08-11 by enumerating the table
      (docs/state-dispatch-table.md, generated by recon/state_table.py): all
      115 rows hold at least one non-null pointer, and row 93 is indeed
      entirely stubs (enter/ai_think/user_think = 0x001B0518, can_leave =
      0x001B0520). Rows 0..92 is 93 rows, so the documented count is almost
      certainly someone stopping at the first all-stub row. The table has 115.
      WARNING for patchers: 26 handler addresses are shared by more than one
      state -- 47 and 72 differ ONLY in `enter`, sharing can_leave, ai_think,
      user_think and extra -- so patching a handler changes every state that
      points at it. The generated doc lists them.

  ptrk_recency_weights:
    addr: 0x00540FE0
    type: f32
    count: 4
    source: play-tendency-ai.md
    confidence: dump
    note: Reads exactly {1/24, 1/48, 1/96, 1/192} as documented.

  ptrk_success_weights:
    addr: 0x00540FF0
    type: f32
    count: 4
    source: play-tendency-ai.md
    confidence: dump
    note: Reads {0.0625, 0.0104167, 0.00520833, 0.0026875}.

  settings_master:
    addr: 0x00545918
    type: fourcc
    count: 392
    source: slider-behavior.md
    confidence: dump
    note: >-
      A different, longer list than the 131-entry option table and not a
      superset in index order -- it starts OQLN OSLE OFIN OFFA OFPC OFMC OPFS,
      skipping option indices 5 and 7..15. Storage-class array at 0x00545F38.

  pass_rush_run_table:
    addr: 0x00526668
    stride: 24
    source: pass-rush.md
    confidence: dump
    note: >-
      Confirmed as 24-byte records of small ids with 0xFFFF terminators.
      cpu-dt-animations.md records that an earlier doc had this table and the
      pass table the other way round; the current assignment is unverified.

  pass_rush_pass_table:
    addr: 0x00526710
    stride: 24
    source: pass-rush.md
    confidence: dump

  blocker_position_dispatch:
    addr: 0x00583860
    type: u32
    count: 24
    source: fb-wr-blocking.md
    confidence: dump
    note: >-
      24 code pointers, confirmed. fb-wr-blocking.md calls +4 the FB slot and
      +8 the WR slot, which would make the index a position byte -- but the
      position byte has WR at 3, not 2. The index is therefore NOT
      player+0xB04. Do not decode with the position enum.

  penalty_names:
    addr: 0x005435E8
    type: cstr_ptr
    count: 18
    source: slider-behavior.md
    confidence: dump
    note: >-
      slider-behavior.md calls this table "the engine's penalty-type enum,
      indexed forward by TryPenalty's type argument" and gives three anchors
      (0 CLIPPING, 9 PASS INTERFERENCE, 17 ILLEGAL PROCEDURE). All three land.
      The full 18 are now read out and mirrored into enums.penalty_type.

  penalty_yardage:
    addr: 0x00541338
    stride: 12
    count: 18
    source: slider-behavior.md
    confidence: doc
    note: Stride inferred from 18 rows over the span; contents not decoded.

  rng_context:
    addr: 0x006046BC
    type: ptr
    confidence: code
    source: experiments/pass_protection.py (decay derivation); 0x002f93b0 disassembly
    note: >-
      The engine RNG's context pointer. 0x002f93b0 -- the roll the
      pass-protection decay calls once per component -- reads it gp-relative
      (lw a1, -4148(gp)), takes a CHANNEL index in a0 (masked to 8 bits), and
      indexes an array of per-channel seed words at [ctx+0x14] + channel*4,
      advancing the seed via 0x00468fa8. Channel 0 additionally increments two
      counters at ctx+8 / ctx+12. 205 call sites.
      WHY IT MATTERS: the seeds live in EE memory, so a savestate freezes the
      dice -- which is the whole mechanism behind the harness's bit-identical
      replays (every zero-width IQR measured 2026-08-11). Replaying live
      without a reload resumes the streams mid-sequence, which is why the same
      play against the same call plays out differently at the console.
      CAPABILITY, untested: writing a different seed per iteration would turn
      one savestate into N distinct worlds with everything else held constant
      -- exactly what defender-catch-requirements.md flags as needed for any
      Bernoulli measurement. The seed array's element format and channel
      assignments are NOT decoded; do not write to it until they are.

  handle_kind_dispatch:
    addr: 0x0057B680
    type: u32
    count: 10
    source: world.py (this map)
    confidence: code
    note: >-
      The jump table inside the handle resolver 0x0013B798. Kind 1 resolves to
      GetPlayer; kinds 0 and 8 fall through to the null arm.

