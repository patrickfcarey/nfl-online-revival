# ---------------------------------------------------------------------------
# Structures
# ---------------------------------------------------------------------------
structs:

  # GetPlayer(side, index) = desc.base + (side * desc.per_side + index) * 5312
  # -- read straight off 0x001655B0. This is where the stride comes from.
  player_array_desc:
    source: world.py (this map)
    confidence: dump
    note: >-
      Reads base=0x00661B90, per_side=11, total=22 in extract/ee_inplay.bin.
      NOTE FOR ANYONE DEBUGGING THIS: 0x00600E48 points at the DESCRIPTOR, not
      at the player array and not at an array of player pointers. Treating the
      target as either produces one plausible-looking record followed by
      garbage, which is the trap this note exists to prevent.
    fields:
      base:      {offset: 0x00, type: ptr, note: first player object}
      per_side:  {offset: 0x08, type: u16, note: players per team; the side multiplier}
      total:     {offset: 0x0A, type: u16, note: loop bound in the reverse lookup 0x001655E8}

  player:
    stride: 0x14C0
    stride_source: world.py (this map)
    stride_confidence: dump
    note: >-
      5312 bytes. `addiu v1, zero, 5312` in GetPlayer 0x001655B0, and the same
      constant in the reverse lookup at 0x001655E8. No document records this
      number; lab-design.md left it blank and tooling-gaps.md claimed it was
      known without printing it.
      CONFIRMED against extract/ee_inplay.bin: walking 22 records at this
      stride from the descriptor's base yields side 0 = one QB, one HB, three
      WR, one TE and five OL, and side 1 = four DL, three LB, two CB, FS and
      SS. That is the formation in extract/ee_inplay.png. Any wrong stride
      would not produce a legal offence and a legal 4-3.
    fields:
      handle_kind:
        offset: 0x00
        type: u8
        confidence: dump
        source: world.py (this map)
        note: >-
          Always 1 -- the handle kind for "player". The first word of a player
          object IS its own handle, which is why every cross-reference in the
          engine can store four bytes instead of a pointer.
      side:
        offset: 0x01
        type: u8
        confidence: dump
        source: world.py (this map)
        note: >-
          0 or 1. Reads 0 for slots 0..10 and 1 for slots 11..21 in the in-play
          dump. 56 of GetPlayer's 466 call sites load the side argument with
          `lbu a0, 1(rs)`.
      index:
        offset: 0x02
        type: u8
        confidence: dump
        source: world.py (this map)
        note: The player's slot within his side. Reads 0..10 twice over.
      controller:
        offset: 0x08
        type: u8
        confidence: dump
        source: cpu-dt-animations.md
        note: >-
          255 = AI, confirmed: in extract/ee_inplay.bin exactly one player
          reads 0 -- side 0 index 0, the quarterback -- and the other 21 read
          255. The dump is practice mode with the human on offence, so this
          also identifies the human-controlled player.
      flags_0c:
        offset: 0x0C
        type: u32
        confidence: code
        source: double-team-requirements.md; disassembled at 0x001e8184 and
          observed live once, 2026-08-11
        note: >-
          A per-player flag word, and the reason a blocked man can look like a
          statue. BIT 2 IS A ONE-SHOT TRIGGER. At 0x001e8184 the engine reads
          `lw v1, 12(s0)`, tests `andi v0, v1, 0x0004` and takes
          `beq v0, zero, 0x001e8234` -- bit 2 clear skips the whole block at
          0x001e8180-0x001e822c, speed write included. That block grants
          speed_cmd (+0x1E8) and then clears bit 2 itself, masking with
          0xFFFFFFFB at 0x001e81a8/0x001e81b0; bit 11 is cleared in the same
          block with 0xFFFFF7FF at 0x001e81cc. Observed live on a single player
          sampled every frame the poll loop could reach -- frame 442 flags
          0x00040004 with bit 2 set and speed 0.0, frame 443 flags 0x00040000
          with bit 2 cleared and speed 0.1908, then 0.1660 and 0.1380 over the
          following frames. So a man is not HELD at zero: he is granted speed
          once, on entry, and it decays from there. A statue is a man whose
          trigger has not fired recently. Graded `code` rather than `dump`
          because the mechanism comes from the instructions and the live
          sighting is ONE transition on ONE player -- and that sighting carries
          two limits worth repeating before anyone patches against it. It was
          caught in ai_state 62, not 32, so the block is shared and not
          double-team-specific; and the transient lasts a single frame, which an
          11-player four-read-per-player loop missed entirely on its first
          attempt. Reading this field needs a single-player probe, not a
          22-player sweep, which is why experiments/double_team.py deliberately
          leaves it out of its sample spec.
      pos_x:
        offset: 0x190
        type: f32
        confidence: dump
        source: world.py (this map)
      pos_y:
        offset: 0x194
        type: f32
        confidence: dump
        source: world.py (this map)
        note: >-
          The downfield axis, in yards. Confirmed in extract/ee_inplay.bin: the
          offence sits at y 8.0-14.2 and the defence at y 16.7-25.9, and the
          five offensive linemen line up at x -3.34 -1.67 -0.21 1.67 3.35 --
          evenly spaced about the centre, which is what makes the x/y
          assignment unambiguous rather than a coin flip. The jam eligibility
          helper 0x001B9360 uses receiver.y < defender.y as its "downfield"
          test, reading 404(s0).
      pos_z:
        offset: 0x198
        type: f32
        confidence: dump
        source: world.py (this map)
      vel_x:
        offset: 0x1B8
        type: f32
        confidence: code
        source: world.py (this map)
        note: >-
          The lead-blocker "x2 velocity lead" at 0x001B6274..0x001B6294 loads
          0x1B8 and 0x1BC, doubles each, and adds them into the 0x190/0x194
          position it just copied. That pins position and velocity together.
          No document publishes either offset.
      vel_y:
        offset: 0x1BC
        type: f32
        confidence: code
        source: world.py (this map)
      vel_z:
        offset: 0x1C0
        type: f32
        confidence: doc
        source: world.py (this map)
        note: Inferred from the x/y pair. Not observed in code.
      speed_cmd:
        offset: 0x1E8
        type: f32
        confidence: code
        source: lead-blocker-targeting.md
        note: swc1 f0, 488(s1) at 0x001F2068.
      desired_bearing:
        offset: 0x1EC
        type: u32
        confidence: code
        source: lead-blocker-targeting.md
        note: 24-bit BAM angle, 0x01000000 = 360 degrees. sw v0, 492(s1).
      facing:
        offset: 0x1F0
        type: u32
        confidence: code
        source: lead-blocker-targeting.md
        note: BAM angle. sw v0, 496(s1).
      state_chain:
        offset: 0x2FC
        type: ptr
        confidence: doc
        source: fb-wr-blocking.md
        note: >-
          Pointer to 4-byte {id, p1, p2, p3} records; [0] is the current state
          id and [4] the next. Bit 7 of byte 0 means "more follow".
      engagement:
        offset: 0x3E0
        type: u32
        enum: engagement_kind
        confidence: doc
        source: block-cycle.md
      engagement_link:
        offset: 0x3E4
        type: handle
        confidence: doc
        source: pitch-play-runner.md, lead-blocker-targeting.md
        note: Who this player is engaged with. Resolve through the handle format.
      block_mode:
        offset: 0x3F0
        type: u32
        enum: block_mode
        confidence: doc
        source: pass-vs-run-blocking.md, block-cycle.md
      staged_drive:
        offset: 0x404
        type: u32
        confidence: doc
        source: lead-blocker-targeting.md
      staged_bearing:
        offset: 0x40C
        type: u32
        confidence: doc
        source: lead-blocker-targeting.md
        note: Copied into desired_bearing every frame while the engagement holds.
      staged_facing:
        offset: 0x410
        type: u32
        confidence: doc
        source: lead-blocker-targeting.md
      contest_power:
        offset: 0x414
        type: f32
        confidence: code
        source: pass-rush.md, pass-vs-run-blocking.md; offset re-derived from
          the image 2026-08-11 (experiments/pass_protection.py)
        note: >-
          Offset confirmed against the binary, not taken from a doc. The pass
          collapse-decay routine holds the contest block in a register biased
          off the player base -- 0x001f0c74 `addiu s1, s5, 1028`, where s5 is
          the blocker (a0) and 1028 is 0x404 -- and then reads and writes
          `16(s1)`, which is base+0x414. Confirmed live: populated for all
          seven blockers on the slot 7 pass state.
      contest_finesse:
        offset: 0x418
        type: f32
        confidence: code
        source: pass-rush.md, pass-vs-run-blocking.md; offset re-derived from
          the image 2026-08-11
        note: >-
          `20(s1)` in the same routine, same base bias. See contest_power.
      contest_overall:
        offset: 0x41C
        type: f32
        confidence: code
        source: pass-vs-run-blocking.md; offset re-derived from the image
          2026-08-11
        note: >-
          NOT a dead field. fact-check-2026-08.md Tier 1 item 3 refutes
          pass-rush.md's "computed and never read" three times over.
          CORRECTION 2026-08-11: this entry also used to say "read here, never
          written", and that is wrong. It is `24(s1)` / `24(s2)` in the pass
          collapse-decay routine and it is *stored back*: 0x001f1070
          `swc1 f1, 24(s2)` writes the rusher's copy after raising it by a
          random fraction. Observed changing during a live run
          (`rusher_gain` in experiments/pass_protection.py).
      tug_power:
        offset: 0x420
        type: f32
        confidence: doc
        source: pass-rush.md
      tug_finesse:
        offset: 0x424
        type: f32
        confidence: doc
        source: pass-rush.md
      tug_total:
        offset: 0x428
        type: f32
        confidence: doc
        source: pass-rush.md
      engage_timer:
        offset: 0x42C
        type: u16
        confidence: doc
        source: lead-blocker-targeting.md
      reselect_timer:
        offset: 0x432
        type: u16
        confidence: doc
        source: lead-blocker-targeting.md
        note: Initialised to 30 - blockRating/16.
      dt_record:
        offset: 0x436
        type: u8
        confidence: doc
        source: block-cycle.md
        note: Index into play_manager.dt_registry.
      dt_role:
        offset: 0x437
        type: u8
        enum: dt_role
        confidence: doc
        source: block-cycle.md
      height:
        offset: 0xAE8
        type: f32
        confidence: dump
        source: pass-rush.md
        note: >-
          Inches, as a FLOAT -- not the u8 the docs imply. Reads 70.0 to 78.0
          across the 22 players (77.0 for the 6'5" quarterback, 70.0 for a
          corner). All eight load sites in the image are `lwc1`. This is also
          the base address the roster-record fill is handed
          (`addiu s1, s0, 2792`).
      weight:
        offset: 0xAEC
        type: f32
        confidence: dump
        source: tackle-contest.md, pass-rush.md
        note: >-
          POUNDS, AS A FLOAT. Not pounds-minus-160, and not a byte.
          extract/ee_inplay.bin reads 226.0 for the quarterback (Brad Johnson,
          226 lb), 299.0-322.0 for the five offensive linemen and 185.0 for a
          corner. Pounds-minus-160 would make those linemen 459-482 lb.
          All 19 load sites are `lwc1`, and the consumers take
          `cvt.w.s` of the value and add it straight to 0..255 ratings -- see
          the blocking power axis at 0x001EFD14, which computes
          STR + AGI + trunc(weight) + PPBK|PRBK.
          THIS CONTRADICTS fact-check-2026-08.md. Its Tier 2 row rewrites
          tackle-contest.md's "305-lb DT gets +19, 190-lb CB +11" to +9 / +1 on
          the grounds that the field is pounds-minus-160. The original was
          right: 305/16 = 19 and 190/16 = 11 only work in real pounds. The
          pounds-minus-160 encoding is the roster DATABASE column PWGT; the
          player object holds the decoded value. The correction corrected a
          correct number.
      weight_copy:
        offset: 0x1E4
        type: f32
        confidence: code
        source: world.py (this map)
        note: >-
          The roster fill copies the weight here immediately after loading it
          (`lwc1 f0, 2796(s0)` / `swc1 f0, 484(s0)` at 0x0017D034). A second
          copy inside the locomotion block; not known to be kept in sync.
      roster_id:
        offset: 0xAF2
        type: u16
        confidence: code
        source: world.py (this map)
        note: >-
          The lineup copier at 0x0011D61C compares `lhu a0, 2802(s0)` against
          halfword 10 of the source roster record before copying. Meaning
          beyond "identity" is a guess.
      position:
        offset: 0xB04
        type: u8
        enum: position
        confidence: doc
        source: fb-wr-blocking.md, roster-delivery.md
      running_style:
        offset: 0xB07
        type: u8
        enum: running_style
        confidence: doc
        source: hb-vision-and-moves.md, robo-qb.md
        note: >-
          Roster-sourced, and it HAS writers (0x001694A4 and the lineup copier
          at 0x0011D648). fact-check-2026-08.md Tier 1 item 2 refutes
          hb-vision-and-moves.md's "no writer anywhere" headline.
      ratings:
        offset: 0xB70
        type: u16
        count: 21
        enum_index: attribute
        confidence: dump
        source: slider-behavior.md
        note: >-
          Effective ratings, rebuilt by 0x00168598 before each play from the
          roster value, the skill class and the sliders. Scale is 0..255:
          value = trunc(rating * 2.55). Gameplay reads only this table, never
          a raw 0..100 rating. Confirmed: all 462 halfwords in the in-play
          dump fall in 0..255, and the quarterback's row reads high Throw
          Accuracy and Throw Power (242 and 226, indices 17 and 18) and low
          Speed (115, i.e. 45) -- so the ordering is right semantically, not
          only structurally.
      ai_state:
        offset: 0xBCC
        type: u8
        enum: ai_state
        confidence: dump
        source: fb-wr-blocking.md
        note: >-
          The current AI state id. fb-wr-blocking.md flagged this as
          "inference, corroborated by the six-id agreement between two
          independent tables, not proven" -- it is now proven: in
          extract/ee_inplay.bin +0xBCC equals byte 0 of the state-chain record
          for all 22 players, with no exceptions.

  play_manager:
    source: block-cycle.md, lead-blocker-targeting.md
    confidence: code
    note: >-
      Field census done here by scanning every `lw rX, -17520(gp)` in the dump
      and reading the offsets used off the result: only +0x00, +0x54, +0x58,
      +0x59, +0x5A and +0x3E4 appear. That is consistent with the documented
      layout -- the registry occupies +4..+83 and the counter sits at +84.
    fields:
      dt_registry:      {offset: 0x04, type: struct, stride: 20, count: 4, source: block-cycle.md}
      frames_since_snap:
        offset: 0x54
        type: u32
        source: lead-blocker-targeting.md
        confidence: code
        note: >-
          Reset by `sw zero, 84(v1)` at 0x001F7034, incremented by
          `lw/addiu/sw 84(v1)` at 0x001F5B94..0x001F5B9C, and read at 29 sites.
          Confirmed exactly as documented.
      flag_58:          {offset: 0x58, type: u8, confidence: code, source: world.py (this map)}
      flag_59:          {offset: 0x59, type: u8, confidence: code, source: world.py (this map)}
      flag_5a:
        offset: 0x5A
        type: u8
        confidence: code
        source: world.py (this map)
        note: Cleared alongside the frame counter at play init (0x001F702C).

  dt_record:
    stride: 20
    source: block-cycle.md
    confidence: doc
    note: >-
      block-cycle.md names the five members but not their offsets. Encoded in
      declaration order at word granularity, which is a guess about layout, not
      about content. Do not trust the offsets until an in-play dump exists.
    fields:
      primary:  {offset: 0x00, type: handle}
      helper:   {offset: 0x04, type: handle}
      doubled:  {offset: 0x08, type: handle}
      second:   {offset: 0x0C, type: handle}
      active:   {offset: 0x10, type: u32}

  ball_manager:
    source: world.py (this map)
    confidence: code
    note: GetBall 0x001FF9B8 returns `mgr + active*240 + 8`.
    fields:
      active: {offset: 0x01, type: u8, note: which ball record is live}
      balls:  {offset: 0x08, type: struct, stride: 240, struct_name: ball}

  ball:
    stride: 240
    source: zone-bunching.md
    confidence: code
    confidence_note: RESOLVED against extract/ee_inplay.bin -- see below.
    note: >-
      Offsets from the accessors, which resolve a handle stored in the ball:
      0x00200040 -> 0x001FFFF0 -> ResolveHandle(ball+180), and 0x00200070 ->
      0x00200018 -> ResolveHandle(ball+184). zone-bunching.md names 0x00200040
      "carrier" and 0x00200070 "lastCarrier"; the same doc's "+0xB8 has a
      single writer, SetBallCarrier" appeared to contradict that. It does not:
      SetBallCarrier 0x001FFF18 writes the SAME handle to both +0xB4 and +0xB8
      (two calls to the handle setter 0x0013B870 at 0x001FFF54 and 0x001FFF60),
      and only +0xB4 is additionally cleared elsewhere. So +0xB4 is the live
      carrier and +0xB8 is the sticky last carrier, exactly as the accessor
      names say. The in-play dump agrees: pre-snap +0xB4 is null and +0xB8
      holds handle 0x00010001 = side 0, index 1 -- the halfback.
    fields:
      carrier:      {offset: 0xB4, type: handle}
      last_carrier: {offset: 0xB8, type: handle}
      unk_c8:       {offset: 0xC8, type: handle}
      unk_cc:       {offset: 0xCC, type: handle}

  ball_spot:
    source: pitch-play-runner.md
    confidence: doc
    note: >-
      Read by 0x00260208 as two `lwu`, packed into one 64-bit return that
      callers split with dsll32/dsrl32. The loads are `lwu`, so the stored form
      may not be float; treated as f32 here on the doc's word.
    fields:
      x: {offset: 0x0C, type: f32}
      y: {offset: 0x10, type: f32}

  gamestate:
    source: world.py (this map)
    confidence: code
    note: >-
      Only +0x98 and +0x9C are ever touched -- seven references to
      gp-19072 in the whole image, and nothing else. See `phase`.
    fields:
      phase:      {offset: 0x98, type: u32}
      phase_prev: {offset: 0x9C, type: u32}

  slider_block:
    source: slider-behavior.md
    confidence: doc
    note: 31 bytes. Human row at +0, CPU row at +15, master enable at +30.
    fields:
      human:  {offset: 0x00, type: u8, count: 15}
      cpu:    {offset: 0x0F, type: u8, count: 15}
      enable: {offset: 0x1E, type: u8}

  ptrk:
    source: play-tendency-ai.md
    confidence: doc
    note: 1556 bytes; 16-byte header then two 48x16 record rings, one per side.
    fields:
      repetition:
        offset: 0x00
        type: f32
        note: 0.0 when the play is excluded, 0.041667 when included; capped at 0.9375
      success:
        offset: 0x04
        type: f32
        note: consumed as a boolean -- the test is value > 0.25

# ---------------------------------------------------------------------------
# Derived values that are not a plain memory read
# ---------------------------------------------------------------------------
derived:

  frames_since_snap:
    expr: "[[0x00601280] + 0x54]"
    type: u32
    source: lead-blocker-targeting.md
    confidence: code

  phase:
    getter: 0x0015ADA0
    type: u32
    source: fb-wr-blocking.md, press-and-routes.md
    confidence: refuted
    readable: false
    note: >-
      THERE IS NO PLAY-PHASE MEMORY READ, and 0x0015ADA0 is probably not the
      play phase either. Both halves settled against extract/ee_inplay.bin.
      An earlier revision of this map guessed the backing store was
      [[0x00600C70] + 0x98], because the getter returns that when
      0x00154790 yields 3, which happens when the screen id is 0x0E. In the
      in-play dump the screen id reads 2, so the getter takes the OTHER branch
      during actual gameplay and [gamestate+0x98] is not what callers see. It
      reads 6 there, which is simply the literal stored at 0x00148568.
      What the other branch does: 0x0015ADE0 calls 0x0015B418 to find the
      player holding the ball, then 0x0015AEB8, which fetches that player's
      authored play-record class byte through the play blob (0x00243C98) and
      tests it. The result is therefore a property of the CALLED PLAY, not a
      per-frame phase -- which also explains why the jam eligibility helper
      0x001B9360 requires it to equal 3 before allowing a jam: you jam on a
      pass play. "Play phase" in fb-wr-blocking.md and press-and-routes.md is
      most likely a mislabel for a play-type getter.
      Consequence for this layer: `World.phase()` cannot be implemented as a
      read and does not pretend to be. Use `frames_since_snap`, which is a
      genuine per-frame counter, plus the AI state ids, which change between
      pre-snap and live.

  handle:
    type: u32
    layout: "byte0 = kind, byte1 = side, byte2 = index, byte3 = pad"
    resolver: 0x0013B798
    source: world.py (this map)
    confidence: code
    note: >-
      The engine's universal object reference: every cross-reference between
      objects (ball carrier, engagement link, double-team registry) stores one
      of these, not a pointer. Kind indexes a 10-entry jump table at
      0x0057B680; kind 1 is a player and resolves to GetPlayer(side, index).
      Kinds 0 and 8 are null. The other kinds are unidentified.

# ---------------------------------------------------------------------------
# Enumerations
# ---------------------------------------------------------------------------
enums:

  position:
    source: fb-wr-blocking.md, roster-delivery.md
    confidence: dump
    note: >-
      Madden order, QB=0 .. P=20. Only 13/14/15 (linebackers, from the man
      coverage jam's explicit LB arm), 16 (CB), 17 and 18 (FS/SS) are attested
      against the executable. The rest come from roster-delivery.md's PPOS
      column encoding, which reproduces all six ELF anchors exactly -- strong
      circumstantial evidence that the roster column and player+0xB04 share an
      encoding, but nothing proves the identity.
      CLOSED against extract/ee_inplay.bin. Side 0 reads
      0,1,3,3,3,4,5,6,7,8,9 -- QB, HB, three WR, TE, and exactly five distinct
      values 5..9 in left-to-right x order, so 5..9 IS the offensive line and
      that order is LT LG C RG RT. Side 1 reads
      11,12,12,10,15,14,13,16,17,18,16 -- four down linemen inside 10..12,
      three linebackers inside 13..15, two 16s (corners) plus 17 and 18. That
      is a 4-3 against three receivers, which is what extract/ee_inplay.png
      shows. The individual DL labels within 10..12 and the LOLB/MLB/ROLB
      order within 13..15 are still inferred; everything else is observed.
    values:
      0: QB
      1: HB
      2: FB
      3: WR
      4: TE
      16: CB
      17: FS
      18: SS
      19: K
      20: P
    ranges:
      OL: [5, 9]
      DL: [10, 12]
      LB: [13, 15]

  running_style:
    source: hb-vision-and-moves.md, robo-qb.md
    confidence: dump
    note: >-
      Dual purpose. For a halfback the byte selects the gap-steer style
      (0 -> style 0, 0% steer; 1 -> style 2, 65%; >=2 -> style 1, 35%). For a
      quarterback the same byte is the QB type, where 1 is a scrambler.
      Observed values in the in-play dump are 0, 1 and 2 across all positions,
      so the byte is populated for everyone -- it is not HB/FB-only storage.

  engagement_kind:
    source: block-cycle.md
    confidence: doc
    values:
      0: idle
      1: idle
      2: assigned, approaching
      3: assigned, approaching a ball carrier
      4: in contact
      5: scripted two-man animation, first frame
      6: scripted two-man animation, running
      7: assigned as the second man on a double team
      8: attached as the second man; the double team is live
      9: reverse marker -- a blocker is coming for me

  block_mode:
    source: pass-vs-run-blocking.md, block-cycle.md
    confidence: doc
    note: >-
      Not a play-phase flag. Mode 3 is written only by state 47's enter, and
      the blocker assignment list admits modes 1 and 2 only -- which is why a
      lead-blocking fullback is never entered into the assignment system.
      Single writer, SetBlockMode 0x001F7568, 37 call sites.
    values:
      0: not blocking
      1: pass block
      2: run block
      3: lead / pull

  dt_role:
    source: block-cycle.md
    confidence: doc
    values:
      0: primary blocker
      1: helper
      2: doubled defender
      3: peel-off defender
      5: free

  attribute:
    source: cpu-dt-animations.md
    confidence: dump
    note: >-
      Read directly out of the fourcc table at 0x00520140, so this is the
      engine's own order, not a reconstruction. It matches the attribute run
      in roster-checksum.md's 31 marshalled roster columns exactly, which
      settles the ELF-vs-roster ordering question for the ratings block.
    values:
      0: ACC
      1: AGI
      2: AWR
      3: BTK
      4: CAR
      5: CTH
      6: JMP
      7: IMP
      8: INJ
      9: KAC
      10: KPR
